services:
  frontend:
    image: nginx:1.25-alpine
    container_name: network_frontend
    ports:
      - "80:80"
    networks:
      - frontend_net

  backend:
    image: node:20-alpine
    container_name: network_backend
    command: ["node", "-e", "console.log('Backend corriendo...')"]
    networks:
      - frontend_net
      - backend_net

  database:
    image: postgres:16-alpine
    container_name: network_db
    environment:
      POSTGRES_PASSWORD: secret_db_pass
    networks:
      - backend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge